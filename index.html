html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vorschau für Therapieteam Rheine</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        h1 { font-size: 24px; color: #0077b6; }
        p { font-size: 16px; line-height: 1.5; color: #666; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ihr neuer Praxis-Assistent steht bereit!</h1>
        <p>Hallo Therapieteam Rheine,<br><br>
        dies ist eine Live-Vorschau. Ihr individueller KI-Assistent öffnet sich jetzt vollautomatisch unten rechts.</p>
    </div>

    <!-- Botpress Scripte -->
    <script src="https://botpress.cloud"></script>
    <script src="https://bpcontent.cloud" defer></script>

    <!-- Code für das automatische Öffnen -->
    <script>
        window.botpress.on('webchat:initialized', () => {
            window.botpress.open();
        });
    </script>

</body>
</html>
